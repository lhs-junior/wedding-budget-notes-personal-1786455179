<h1>아이웨딩 검증 보드가 스드메 탭으로 옮겨졌어요</h1>
<p>2026-10-25 재검증 결과(상세페이지 실측 가격, 추가금, 후기 근거, 조합 비교 계산기)는 <a href="./index.html">결혼 준비 기록부 → 스드메 탭 → "아이웨딩 상세페이지 재검증"</a>에서 볼 수 있어요.</p>
<p class="note">이 페이지의 예전 표에는 오류가 있었어요. 원규 패키지 220만(실제 상세 특전가 253만), 아우어 토탈 패키지 218.5만(실제 191만), "에델린 실크 기본 라벨 확인"(아이웨딩 분류는 "비즈 드레스"), "상세페이지 0원"(정적 수집 오류, 실제 렌더링에서는 가격 표시)을 바로잡았어요.</p>
